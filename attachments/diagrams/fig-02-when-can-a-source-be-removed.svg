  <text x="404" y="125" text-anchor="start" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>5 V</tspan></text>
  <line x1="380" y1="134" x2="380" y2="160" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="380" y1="160" x2="380" y2="168" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="369" y1="168" x2="391" y2="168" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="373" y1="173" x2="387" y2="173" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="377" y1="178" x2="383" y2="178" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="620" cy="70" r="4" fill="#1f2937"/>
  <text x="634" y="74" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>node a</tspan></text>
  <line x1="620" y1="70" x2="620" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="620" cy="120" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="620" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif">+</text>
  <text x="620" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif">−</text>
  <text x="644" y="125" text-anchor="start" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>5 V</tspan></text>
  <line x1="620" y1="134" x2="620" y2="170" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="620" cy="170" r="4" fill="#1f2937"/>
