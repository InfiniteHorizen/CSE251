  <line x1="137" y1="178" x2="143" y2="178" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="380" cy="70" r="4" fill="#1f2937"/>
  <text x="394" y="74" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>to the circuit</tspan></text>
  <line x1="380" y1="70" x2="380" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="380" cy="120" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="380" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif">+</text>
