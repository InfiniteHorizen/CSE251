<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">When can a source be removed</title><desc id="d">A source can be removed only if one of its ends is ground. Keeping the ground wire after replacing it with a label creates a short circuit. A floating source must stay.</desc>
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f2937"/></marker></defs>
  <rect x="1" y="1" width="758" height="378" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="140" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Cell with a grounded end</tspan></text>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Wrong: ground wire kept</tspan></text>
  <text x="620" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>No ground on either end</tspan></text>
  <circle cx="140" cy="70" r="4" fill="#1f2937"/>
  <text x="154" y="74" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>to the circuit</tspan></text>
  <line x1="140" y1="70" x2="140" y2="106" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140" cy="120" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="140" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif">+</text>
  <text x="140" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif">−</text>
  <text x="164" y="125" text-anchor="start" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>5 V</tspan></text>
  <line x1="140" y1="134" x2="140" y2="160" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="160" x2="140" y2="168" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="129" y1="168" x2="151" y2="168" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
