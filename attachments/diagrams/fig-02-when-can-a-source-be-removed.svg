  <line x1="140" y1="200" x2="140" y2="232" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <line x1="380" y1="200" x2="380" y2="232" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <circle cx="140" cy="262" r="5" fill="#1d4ed8"/>
  <text x="140" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>5 V</tspan></text>
  <text x="140" y="305" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>✓ Remove the cell,</tspan></text>
  <text x="140" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>write 5 V on the point</tspan></text>
  <circle cx="380" cy="262" r="5" fill="#1d4ed8"/>
  <text x="380" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>5 V</tspan></text>
  <line x1="380" y1="262" x2="380" y2="282" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <line x1="380" y1="282" x2="380" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="369" y1="290" x2="391" y2="290" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="373" y1="295" x2="387" y2="295" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="377" y1="300" x2="383" y2="300" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="402" y="272" text-anchor="start" font-size="13" font-weight="600" fill="#b91c1c" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>also 0 V ?!</tspan></text>
  <text x="380" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>✗ 5 V and 0 V at one point</tspan></text>
  <text x="380" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>= short circuit</tspan></text>
  <text x="620" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Neither end is ground,</tspan></text>
  <text x="620" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>so there is no known</tspan></text>
  <text x="620" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>potential to write down.</tspan></text>
  <text x="620" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>✓ Keep the source drawn</tspan></text>
</svg>
