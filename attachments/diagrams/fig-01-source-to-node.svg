  <line x1="607" y1="243" x2="613" y2="243" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="325" y1="150" x2="375" y2="150" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="150" y="275" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Source drawn as a battery</tspan></text>
  <text x="570" y="275" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Remove it: top point = 10 V, bottom = ground (0 V)</tspan></text>
  <text x="380" y="297" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Allowed because the battery's − end sits on ground.</tspan></text>
</svg>
