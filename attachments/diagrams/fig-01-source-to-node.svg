<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="t d">
  <title id="t">Replacing a grounded source with a node label</title><desc id="d">A 10 V battery with its negative end on ground is removed; its positive end becomes a point labelled 10 V.</desc>
