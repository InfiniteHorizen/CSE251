  <rect x="1" y="1" width="758" height="308" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="150" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>Before: source drawn</tspan></text>
  <text x="570" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>After: line circuit</tspan></text>
  <line x1="70" y1="70" x2="190" y2="70" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
