  <text x="48" y="130" text-anchor="end" font-size="14" font-weight="600" fill="#1d4ed8" font-family="Inter, 'Segoe UI', Arial, sans-serif"><tspan>10 V</tspan></text>
  <line x1="150" y1="225" x2="70" y2="225" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <polyline points="190.0,70.0 190.0,82.0 198.0,84.6 182.0,89.8 198.0,94.9 182.0,100.1 198.0,105.2 182.0,110.4 190.0,113.0 190.0,125.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
