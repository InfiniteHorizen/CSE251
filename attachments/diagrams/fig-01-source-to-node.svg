  <polyline points="230.0,125.0 230.0,137.0 238.0,143.3 222.0,156.0 238.0,168.7 222.0,181.3 238.0,194.0 222.0,206.7 230.0,213.0 230.0,225.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
